# USD per 1M tokens. Only prices read from the source page on the date given; anything unverified is null,
# and reports then show tokens instead of dollars. record_baseline.PRICES loads this file.
# gpt-4 / gpt-3.5-turbo resolve to gpt-4-0613 / gpt-3.5-turbo-0125 (see results/*.jsonl resolved_model).
